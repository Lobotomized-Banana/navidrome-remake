<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Navidrome Remake</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #status { font: 16px system-ui, sans-serif; padding: 24px; }
  /* Rune has no web audio backend; playback is driven by this element via JS glue. */
  #nd-audio { display: none; }
</style>
<div id="status">Loading Navidrome Remake…</div>
<audio id="nd-audio" preload="none"></audio>
<script>
// Diagnostic: add ?forceWebGL to exercise the WebGL2 fallback path.
if (new URLSearchParams(location.search).has('forceWebGL')) {
  Object.defineProperty(navigator, 'gpu', {value: undefined, configurable: true});
}
</script>
<script type="module">
import init from './app.js';
try {
  // Rune uses WebGPU when available and falls back to WebGL2 (built with the
  // `webgl` feature), so this also works over plain HTTP on a LAN.
  await init();
  document.querySelector('#status').remove();
} catch (error) {
  document.querySelector('#status').textContent = String(error);
  console.error(error);
}
</script>
</html>
